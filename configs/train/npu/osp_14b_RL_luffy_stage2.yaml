model_name: "osp_next"
seed: 42

output_dir: "/home/ma-user/work/xianyi/osp_next/OSP-Next/ckpts/video_luffy_stage2"

num_epochs: 1000
# ddp_size: 1
fsdp_size: 16
sp_size: 4
skiparse_sp_size: 4
use_sequence_parallel: False
use_skiparse_sequence_parallel: True
reshard_after_forward: Null
explicit_prefetching_num_blocks: 0
gradient_checkpointing: True
gradient_accumulation_steps: 1
init_max_grad_norm: 1.0
log_interval: 1
save_interval: 1
weight_dtype: "bf16"
ema_decay: 0.999 # 0.999 is used for the 14B model
ema_update_interval: 1
save_with_dcp_api: True
model_cpu_offload: False
encoder_cpu_offload: False
profiling: False

wandb_config:
  project_name: "osp_next_RL_luffy_stage2"
  exp_name: "osp_next_RL_luffy_stage2_rank32_lr4e-4_gt_mse"

model_config:
  dim: 5120
  ffn_dim: 13824
  freq_dim: 256
  in_dim: 16
  num_heads: 40
  num_layers: 40
  out_dim: 16
  text_len: 512
  skiparse_model_type: "dual_end"
  sparse_ratio: 2
  num_full_blocks: 8
  pretrained_model_dir_or_checkpoint: "/home/ma-user/work/gyy/TorchDiff/output/osp_next_14b_81f720p_sparse2d2_ssp4/iter_000006000/ema_model_state_dict.pt"

scheduler_config:
  scheduler_name: "flow_matching"
  shift: 7.5
  use_logitnorm_time_sampling: true

vae_config:
  vae_path: "/home/ma-user/work/gyy/TorchDiff/Wan2.1-T2V-14B/Wan2.1_VAE.pth"
  dtype: "fp32"

text_encoder_config:
  text_len: 512
  checkpoint_path: "/home/ma-user/work/gyy/TorchDiff/Wan2.1-T2V-14B/models_t5_umt5-xxl-enc-bf16.pth"
  use_fsdp: True

# RL training uses a text-only prompt dataset, only the tokenizer is needed here.
data_config:
  dataset_config:
    text_tokenizer_path: "/home/ma-user/work/gyy/TorchDiff/Wan2.1-T2V-14B/google/umt5-xxl"
    tokenizer_max_length: 512

optimizer_config:
  lr: 0.0004 # 4e-4
  weight_decay: 0.001 # 1e-3

lora_config:
  rank: 32
  alpha: 64
  target_modules:
    - "self_attn.q"
    - "self_attn.k"
    - "self_attn.v"
    - "self_attn.o"
    - "cross_attn.q"
    - "cross_attn.k"
    - "cross_attn.v"
    - "cross_attn.o"
  # Stage2 normally starts from a stage1 LoRA checkpoint. Fill this with the
  # selected stage1 checkpoint directory, e.g. ".../video_luffy_stage1/lora-checkpoint-STEP".
  # lora_path: "/home/ma-user/work/xianyi/osp_next/OSP-Next/ckpts/video_luffy_stage1/lora-checkpoint-STEP"

rl_config:
  # prompt_file: "/path/to/prompt_file"
  eval_prompt_file: "/home/ma-user/work/xianyi/osp_next/dataset/vbench/sora_test.txt"
  height: 720
  width: 1280
  num_frames: 81
  sde_steps: 10
  num_inference_steps: 25
  guidance_scale: 5.0
  kl_beta: 0.004
  num_batches_per_epoch: 4
  num_image_per_prompt: 4
  sample_time_per_prompt: 1
  sample_batch_size: 2
  train_batch_size: 2
  eval_num_steps: 50
  eval_freq: 2000000
  use_cfg_in_train: True
  adv_clip_max: 5.0
  clip_range: 0.0001
  reward_fn:
    videoalign: 1.0
  gt_guidance:
    enable: True
    prompt_file: "/home/ma-user/work/xianyi/osp_next/dataset/vbench/vbench_train.txt"
    gt_video_dir: "/home/ma-user/work/xianyi/osp_next/dataset/wan14B_offline"
  gt_teacher_forcing:
    enable: True
    loss_weight: 0.05
    adv_clip_max: 5.0
    positive_only: True
    train_batch_size: 2
    every_n_steps: 1
